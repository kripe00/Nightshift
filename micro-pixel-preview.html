      <!-- Pixel Density / Micro Resolution Switcher -->

    <div class="pixel-stage" id="pixelStage">
      <canvas id="microCanvas" width="560" height="315"></canvas>
    </div>

    <div class="caption-bar">
      <span id="resLabel">
        Aktiv oppløsning: <strong>560×315 ekte micro-pixel</strong> (Bayer 4×4 dithering, 1px skrå trappe-outlines, 32-fargers sovjet-palett)
      </span>
      <span>DRA SPAKER OPP/NED MED MUSEN (ELLER TRYKK AZ-5) I BILDET</span>
    </div>

    <script>
      const canvas = document.getElementById("microCanvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      // Offscreen scene buffer (gets quantized & Bayer-dithered to crisp micro-pixels)
      const sceneCanvas = document.createElement("canvas");
      const sctx = sceneCanvas.getContext("2d", { willReadFrequently: true });

      let BASE_W = 560;
      let BASE_H = 315;

      function setResolution(w) {
        BASE_W = w;
        BASE_H = Math.round((w * 9) / 16);
        canvas.width = BASE_W;
        canvas.height = BASE_H;
        sceneCanvas.width = BASE_W;
        sceneCanvas.height = BASE_H;
        document.getElementById("resLabel").innerHTML =
          `Aktiv oppløsning: <strong>${BASE_W}×${BASE_H} ekte micro-pixel</strong> (Bayer 4×4 dithering, 1px trappe-outlines &amp; låst sovjet-palett)`;
      }

      // 32-Color Locked 1984 Soviet Control Room Palette (sampled from unnamed.jpg & unnamed (2).jpg)
      const PALETTE_HEX = [
        "#0a0c0a", // 0: Ink Black outline
        "#161c16", // 1: Deep iron shadow
        "#222c21", // 2: Dark olive shadow
        "#2f3e2e", // 3: Desk olive dark
        "#3c4e3b", // 4: Desk olive base
        "#4b6048", // 5: Panel olive mid
        "#5d7458", // 6: Panel olive light
        "#758c6f", // 7: Panel highlight edge
        "#3b1d10", // 8: Rust deep
        "#592b16", // 9: Rust mid
        "#783b1e", // 10: Rust bright
        "#94522d", // 11: Rust orange-ochre
        "#e6ddb8", // 12: Dial cream bright
        "#cfc399", // 13: Dial cream mid
        "#ab9e74", // 14: Dial cream shadow
        "#30342f", // 15: CRT Bezel dark
        "#484d46", // 16: CRT Bezel mid
        "#636960", // 17: CRT Bezel light
        "#858c81", // 18: Steel bolt light
        "#041307", // 19: CRT phosphor black-green
        "#0b2910", // 20: CRT grid dark green
        "#165922", // 21: CRT phosphor dim
        "#25a33c", // 22: CRT phosphor mid
        "#39ff5a", // 23: CRT phosphor bright
        "#a8ffba", // 24: CRT radar blip white-green
        "#630b08", // 25: Red dark (AZ-5 shadow)
        "#a31914", // 26: Red mid (AZ-5 / star)
        "#eb261f", // 27: Red lamp bright
        "#ff881c", // 28: Orange lamp bright
        "#8f4209", // 29: Orange lamp dark
        "#c7a236", // 30: Rad light ochre gold
        "#ffe338", // 31: Yellow lamp bright
      ];

      const PALETTE_RGB = PALETTE_HEX.map((h) => [
        parseInt(h.slice(1, 3), 16),
        parseInt(h.slice(3, 5), 16),
        parseInt(h.slice(5, 7), 16),
      ]);

      // 4x4 Bayer Ordered Dithering Matrix (normalized -0.5 to +0.5)
      const BAYER_4X4 = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ].map((row) => row.map((v) => v / 16 - 0.5));

      // Fast RGB -> Nearest Soviet Palette LUT (5 bits per channel = 32768 entries)
      const LUT = new Uint8Array(32768);
      for (let r5 = 0; r5 < 32; r5++) {
        for (let g5 = 0; g5 < 32; g5++) {
          for (let b5 = 0; b5 < 32; b5++) {
            const r = (r5 << 3) | (r5 >> 2);
            const g = (g5 << 3) | (g5 >> 2);
            const b = (b5 << 3) | (b5 >> 2);
            let bestIdx = 0;
            let bestDist = 1e9;
            for (let i = 0; i < PALETTE_RGB.length; i++) {
              const pr = PALETTE_RGB[i][0];
              const pg = PALETTE_RGB[i][1];
              const pb = PALETTE_RGB[i][2];
              const dr = r - pr;
              const dg = g - pg;
              const db = b - pb;
              // Perceptual weight
              const d = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
              if (d < bestDist) {
                bestDist = d;
                bestIdx = i;
              }
            }
            LUT[(r5 << 10) | (g5 << 5) | b5] = bestIdx;
          }
        }
      }

      const state = {
        crtPower: true,
        redline: false,
        switches: [true, true, false],
        az5Pressed: false,
        tick: 0,
      };

      // Draw scene in logical 560x315 coordinates (auto-scaled to BASE_W x BASE_H)
      function drawMicroScene(g) {
        g.save();
        const scale = BASE_W / 560;
        g.scale(scale, scale);

        // 1. Desk Background
        g.fillStyle = "#3c4e3b";
        g.fillRect(0, 0, 560, 315);

        // Weathered rust & oil patches on desk (will become Bayer-dithered pixel clusters!)
        const rustSpots = [
          { x: 35, y: 65, r: 34 },
          { x: 185, y: 45, r: 22 },
          { x: 265, y: 278, r: 44 },
          { x: 510, y: 285, r: 36 },
          { x: 325, y: 125, r: 25 },
          { x: 14, y: 260, r: 28 },
        ];
        rustSpots.forEach((s) => {
          const grad = g.createRadialGradient(s.x, s.y, 2, s.x, s.y, s.r);
          grad.addColorStop(0, "#4a2413");
          grad.addColorStop(0.55, "rgba(115, 55, 28, 0.7)");
          grad.addColorStop(1, "rgba(60, 78, 59, 0)");
          g.fillStyle = grad;
          g.beginPath();
          g.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          g.fill();
        });

        // Scratches and cables on desk
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 4;
        g.beginPath();
        g.moveTo(155, 38);
        g.lineTo(164, 18);
        g.moveTo(318, 92);
        g.bezierCurveTo(335, 92, 342, 74, 360, 76);
        g.stroke();

        g.strokeStyle = "#222c21";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(210, 108);
        g.lineTo(232, 114);
        g.moveTo(18, 292);
        g.lineTo(52, 305);
        g.stroke();

        // 2. Top Header Bar ("REACTOR & COOLING")
        g.fillStyle = "#263325";
        g.fillRect(0, 0, 560, 28);
        g.fillStyle = "#0a0c0a";
        g.fillRect(0, 26, 560, 3);

        // Favicon in top-left of header
        g.fillStyle = "#0a0c0a";
        g.fillRect(8, 4, 20, 20);
        g.fillStyle = "#2f3e2e";
        g.fillRect(10, 6, 16, 16);
        g.fillStyle = "#ffe338";
        g.fillRect(16, 7, 4, 4);
        g.fillRect(11, 15, 4, 4);
        g.fillRect(21, 15, 4, 4);
        g.fillStyle = "#eb261f";
        g.fillRect(17, 13, 2, 2);

        g.font = "bold 22px VT323, monospace";
        g.textAlign = "center";
        g.fillStyle = "#0a0c0a";
        g.fillText("REACTOR & COOLING", 282, 21);
        g.fillStyle = "#e6ddb8";
        g.fillText("REACTOR & COOLING", 280, 19);

        // 3. Tilted Gauge Housing Box for first 2 gauges (CORE TEMP & OUTPUT)
        g.save();
        g.translate(82, 74);
        g.rotate(-0.065);
        // Drop shadow
        g.fillStyle = "#0a0c0a";
        g.fillRect(-70, -37, 146, 78);
        // Green metal box
        g.fillStyle = "#4b6048";
        g.fillRect(-73, -40, 146, 78);
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 2.5;
        g.strokeRect(-73, -40, 146, 78);
        // Highlight edge
        g.strokeStyle = "#758c6f";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(-71, 36);
        g.lineTo(-71, -38);
        g.lineTo(71, -38);
        g.stroke();
        // Rust on housing corner
        const rg1 = g.createRadialGradient(54, 24, 2, 54, 24, 24);
        rg1.addColorStop(0, "#592b16");
        rg1.addColorStop(1, "rgba(75,96,72,0)");
        g.fillStyle = rg1;
        g.fillRect(20, -5, 50, 42);
        g.restore();

        // Helper for 5 Detailed Micro-Pixel Gauges
        function drawDetailedGauge(cx, cy, label, unitTop, unitBot, ticks, needleDeg, isRad) {
          // Outer shadow
          g.fillStyle = "#0a0c0a";
          g.beginPath();
          g.arc(cx + 2, cy + 3, 28, 0, Math.PI * 2);
          g.fill();

          // Dark notched bezel
          g.fillStyle = "#161c16";
          g.beginPath();
          g.arc(cx, cy, 28, 0, Math.PI * 2);
          g.fill();
          g.strokeStyle = "#0a0c0a";
          g.lineWidth = 2.5;
          g.stroke();

          // Bezel metallic rim & 8 rivets
          g.strokeStyle = "#30342f";
          g.lineWidth = 2;
          g.beginPath();
          g.arc(cx, cy, 24.5, 0, Math.PI * 2);
          g.stroke();

          for (let a = 0; a < 360; a += 45) {
            const rad = (a * Math.PI) / 180;
            g.fillStyle = "#0a0c0a";
            g.fillRect(cx + Math.cos(rad) * 25 - 1, cy + Math.sin(rad) * 25 - 1, 2.5, 2.5);
          }

          if (isRad) {
            // Yellow/ochre radiation indicator
            const rgrad = g.createRadialGradient(cx - 4, cy - 4, 2, cx, cy, 22);
            rgrad.addColorStop(0, "#ffe338");
            rgrad.addColorStop(0.6, "#c7a236");
            rgrad.addColorStop(1, "#783b1e");
            g.fillStyle = rgrad;
            g.beginPath();
            g.arc(cx, cy, 21, 0, Math.PI * 2);
            g.fill();

            // Trefoil blades
            g.fillStyle = "#0a0c0a";
            [-90, 30, 150].forEach((ang) => {
              g.save();
              g.translate(cx, cy);
              g.rotate((ang * Math.PI) / 180);
              g.beginPath();
              g.moveTo(0, 0);
              g.arc(0, 0, 16, -0.45, 0.45);
              g.closePath();
              g.fill();
              g.restore();
            });
            g.fillStyle = "#c7a236";
            g.beginPath();
            g.arc(cx, cy, 5.5, 0, Math.PI * 2);
            g.fill();
            g.fillStyle = "#0a0c0a";
            g.beginPath();
            g.arc(cx, cy, 3, 0, Math.PI * 2);
            g.fill();
          } else {
            // Cream dial face with inner shadow
            const dgrad = g.createRadialGradient(cx - 5, cy - 5, 3, cx, cy, 22);
            dgrad.addColorStop(0, "#e6ddb8");
            dgrad.addColorStop(0.75, "#cfc399");
            dgrad.addColorStop(1, "#ab9e74");
            g.fillStyle = dgrad;
            g.beginPath();
            g.arc(cx, cy, 21.5, 0, Math.PI * 2);
            g.fill();

            // Tick marks around edge
            for (let a = -215; a <= 35; a += 18) {
              const rad = (a * Math.PI) / 180;
              g.strokeStyle = a > 0 ? "#a31914" : "#0a0c0a";
              g.lineWidth = 1.4;
              g.beginPath();
              g.moveTo(cx + Math.cos(rad) * 17.5, cy + Math.sin(rad) * 17.5);
              g.lineTo(cx + Math.cos(rad) * 21, cy + Math.sin(rad) * 21);
              g.stroke();
            }

            // Micro numbers inside dial
            g.fillStyle = "#0a0c0a";
            g.font = "9px VT323, monospace";
            g.textAlign = "center";
            g.fillText(ticks[0], cx - 11, cy + 3);
            g.fillText(ticks[1], cx - 8, cy - 7);
            g.fillText(ticks[2], cx, cy - 11);
            g.fillText(ticks[3], cx + 9, cy - 7);
            g.fillStyle = "#a31914";
            g.fillText(ticks[4], cx + 11, cy + 4);

            g.fillStyle = "#0a0c0a";
            g.font = "8px VT323, monospace";
            if (unitTop) g.fillText(unitTop, cx, cy - 3);
            if (unitBot) g.fillText(unitBot, cx, cy + 12);

            // Black bottom mask cutout
            g.fillStyle = "#0a0c0a";
            g.beginPath();
            g.moveTo(cx - 10, cy + 20);
            g.lineTo(cx - 6, cy + 15);
            g.lineTo(cx + 6, cy + 15);
            g.lineTo(cx + 10, cy + 20);
            g.closePath();
            g.fill();

            // Needle with jitter
            const jit = state.redline
              ? Math.sin(state.tick * 0.7) * 9
              : Math.sin(state.tick * 0.15) * 1.5;
            const nrad = ((needleDeg + jit) * Math.PI) / 180;
            g.strokeStyle = "#0a0c0a";
            g.lineWidth = 2.5;
            g.beginPath();
            g.moveTo(cx, cy + 2);
            g.lineTo(cx + Math.cos(nrad) * 15, cy + Math.sin(nrad) * 15);
            g.stroke();

            g.fillStyle = "#0a0c0a";
            g.beginPath();
            g.arc(cx, cy + 2, 3.2, 0, Math.PI * 2);
            g.fill();
          }

          // Stenciled label under gauge
          g.font = "bold 12px VT323, monospace";
          g.textAlign = "center";
          g.fillStyle = "#0a0c0a";
          g.fillText(label, cx + 1, cy + 39);
          g.fillStyle = "#e6ddb8";
          g.fillText(label, cx, cy + 38);
        }

        drawDetailedGauge(46, 73, "CORE TEMP", "°C", "mitral", ["90", "300", "360", "460", "500"], state.redline ? -25 : -138, false);
        drawDetailedGauge(114, 70, "OUTPUT MW", "hb/g", "", ["10", "20", "30", "40", "100"], state.redline ? -12 : -130, false);
        drawDetailedGauge(186, 72, "PRESSURE", "hb/g", "", ["20", "30", "40", "50", "70"], -128, false);
        drawDetailedGauge(250, 72, "PRESSURE", "☢", "", ["0", "50", "70", "100", "150"], -125, false);
        drawDetailedGauge(312, 72, "RAD LIGHT", "", "", [], 0, true);

        // 4. Lower-Left Tilted WARNING Switchboard (matches unnamed.jpg)
        g.save();
        g.translate(82, 212);
        g.rotate(-0.11);

        // Drop shadow & plate
        g.fillStyle = "#0a0c0a";
        g.fillRect(-56, -78, 118, 162);
        g.fillStyle = "#4b6048";
        g.fillRect(-60, -82, 118, 162);
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 2.5;
        g.strokeRect(-60, -82, 118, 162);

        // Plate bevel highlight
        g.strokeStyle = "#758c6f";
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(-58, 78);
        g.lineTo(-58, -80);
        g.lineTo(56, -80);
        g.stroke();

        // Rust stains on switchboard
        const swRust = g.createRadialGradient(-42, -10, 2, -42, -10, 26);
        swRust.addColorStop(0, "#592b16");
        swRust.addColorStop(1, "rgba(75,96,72,0)");
        g.fillStyle = swRust;
        g.fillRect(-58, -40, 45, 60);

        g.fillStyle = "#0a0c0a";
        g.font = "bold 13px VT323, monospace";
        g.textAlign = "center";
        g.fillText("WARNING", 0, -68);

        // 3 Glowing Lamps (OWAM, OH, HC)
        const lampDefs = [
          { x: -36, cIn: "#ffe338", cMid: "#eb261f", cOut: "#630b08", lbl: "OWAM" },
          { x: 0, cIn: "#ffe338", cMid: "#ff881c", cOut: "#8f4209", lbl: "OH" },
          { x: 36, cIn: "#ffffff", cMid: "#ffe338", cOut: "#8f4209", lbl: "HC" },
        ];
        lampDefs.forEach((l) => {
          // Dithered glow halo
          const halo = g.createRadialGradient(l.x, -49, 4, l.x, -49, 17);
          halo.addColorStop(0, l.cMid);
          halo.addColorStop(1, "rgba(75,96,72,0)");
          g.fillStyle = halo;
          g.beginPath();
          g.arc(l.x, -49, 17, 0, Math.PI * 2);
          g.fill();

          g.fillStyle = "#0a0c0a";
          g.beginPath();
          g.arc(l.x, -49, 11.5, 0, Math.PI * 2);
          g.fill();

          const bulb = g.createRadialGradient(l.x - 2, -51, 1.5, l.x, -49, 9.5);
          bulb.addColorStop(0, l.cIn);
          bulb.addColorStop(0.55, l.cMid);
          bulb.addColorStop(1, l.cOut);
          g.fillStyle = bulb;
          g.beginPath();
          g.arc(l.x, -49, 9.5, 0, Math.PI * 2);
          g.fill();

          g.fillStyle = "#0a0c0a";
          g.font = "bold 11px VT323, monospace";
          g.fillText(l.lbl, l.x, -31);
        });

        // 3 Toggle Switches
        const swCols = [-36, 0, 36];
        const swSub = ["3PM", "DNK", "DNK"];
        swCols.forEach((sx, idx) => {
          g.fillStyle = "#0a0c0a";
          g.font = "bold 10px VT323, monospace";
          g.fillText("ON", sx, -18);

          // Switch socket
          g.fillStyle = "#222c21";
          g.fillRect(sx - 7, -15, 14, 18);
          g.strokeStyle = "#0a0c0a";
          g.lineWidth = 2;
          g.strokeRect(sx - 7, -15, 14, 18);

          // Toggle bat lever
          const isOn = state.switches[idx];
          g.fillStyle = "#858c81";
          g.fillRect(sx - 3.5, isOn ? -13 : -6, 7, 9);
          g.strokeRect(sx - 3.5, isOn ? -13 : -6, 7, 9);

          g.fillStyle = "#0a0c0a";
          g.fillText("OFF", sx, 12);
          g.fillText(swSub[idx], sx, 20);
        });

        // 3 Knife Breakers at bottom (GPM, DNK, DNK)
        const brkNames = ["GPM", "DNK", "DNK"];
        swCols.forEach((bx, idx) => {
          const brass = idx === 2;
          g.fillStyle = brass ? "#8f4209" : "#30342f";
          g.fillRect(bx - 7, 27, 14, 34);
          g.strokeStyle = "#0a0c0a";
          g.lineWidth = 2;
          g.strokeRect(bx - 7, 27, 14, 34);

          g.fillStyle = brass ? "#c7a236" : "#636960";
          g.fillRect(bx - 4.5, 38, 9, 19);
          g.strokeRect(bx - 4.5, 38, 9, 19);

          g.fillStyle = "#0a0c0a";
          g.font = "bold 11px VT323, monospace";
          g.fillText(brkNames[idx], bx, 72);
        });

        g.restore();

        // 5. Stacked Manual Pages + Spiral Binder + Magnifying Glass + AZ-5 (Center)

        // Wooden Stamp & Metal Latch between switchboard & manual (from unnamed.jpg)

        // Magnifying Glass over Manual
        g.save();

        // 6. K.O.M.R.A.D.-84 CRT Monitor on Right (matches unnamed (2).jpg)

        const sideGrad = g.createLinearGradient(344, 34, 366, 34);

        // Rust chips on CRT bezel
        const crtRust = g.createRadialGradient(372, 214, 2, 372, 214, 18);

        g.fillStyle = crtRust;

        // Dark inner CRT recess
        g.fillStyle = "#161c16";

        // Phosphor CRT Screen
        g.fillStyle = state.crtPower ? "#041307" : "#0a0c0a";
        g.beginPath();
        g.roundRect(378, 50, 152, 140, 12);
        g.fill();
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 2;
        g.stroke();

        if (state.crtPower) {
          // Radial phosphor glow (will Bayer-dither into authentic CRT dither bands!)
          const crtGlow = g.createRadialGradient(454, 120, 10, 454, 120, 82);
          crtGlow.addColorStop(0, "#165922");
          crtGlow.addColorStop(0.65, "#0b2910");
          crtGlow.addColorStop(1, "#041307");
          g.fillStyle = crtGlow;
          g.fillRect(380, 52, 148, 136);

          // 1px Horizontal Scanlines
          g.fillStyle = "#041307";
          for (let sy = 52; sy < 188; sy += 2) {
            g.fillRect(380, sy, 148, 1);
          }

          // Oscilloscope Grid on left
          g.strokeStyle = "#165922";
          g.lineWidth = 1;
          for (let gx = 392; gx <= 440; gx += 16) {
            g.beginPath();
            g.moveTo(gx, 96);
            g.lineTo(gx, 176);
            g.stroke();
          }
          for (let gy = 104; gy <= 176; gy += 16) {
            g.beginPath();
            g.moveTo(386, gy);
            g.lineTo(446, gy);
            g.stroke();
          }

          // Crisp CRT Phosphor Text
          g.fillStyle = "#39ff5a";
          g.font = "bold 12px VT323, monospace";
          g.textAlign = "left";
          g.fillText("K.O.M.R.A.D.-84 // SYS.DEFENSE", 386, 66);

          g.strokeStyle = "#39ff5a";
          g.lineWidth = 1.5;
          g.beginPath();
          g.moveTo(386, 71);
          g.lineTo(522, 71);
          g.stroke();

          g.font = "11px VT323, monospace";
          g.fillText("> SCANNING SECTOR 07... [INTRUSION]", 386, 83);
          g.fillText("> PACKET TRACE: 194.08.11.42", 386, 94);

          // Blinking Block Cursor
          if ((state.tick >> 4) & 1) {
            g.fillStyle = "#39ff5a";
            g.fillRect(386, 102, 7, 11);
          }

          // Radar Sweep in bottom-right (matches unnamed (2).jpg)
          const rcx = 486;
          const rcy = 144;
          g.strokeStyle = "#25a33c";
          g.lineWidth = 1;
          g.setLineDash([2, 2]);
          g.beginPath();
          g.arc(rcx, rcy, 33, 0, Math.PI * 2);
          g.stroke();
          g.beginPath();
          g.arc(rcx, rcy, 15, 0, Math.PI * 2);
          g.stroke();
          g.setLineDash([]);

          g.strokeStyle = "#39ff5a";
          g.lineWidth = 2;
          g.beginPath();
          g.arc(rcx, rcy, 25, 0, Math.PI * 2);
          g.stroke();

          // Sweep cone & line
          const sAngle = (state.tick * 0.04) % (Math.PI * 2);
          g.fillStyle = "rgba(57, 255, 90, 0.28)";
          g.beginPath();
          g.moveTo(rcx, rcy);
          g.arc(rcx, rcy, 25, sAngle - 0.65, sAngle);
          g.closePath();
          g.fill();

          g.strokeStyle = "#39ff5a";
          g.lineWidth = 1.8;
          g.beginPath();
          g.moveTo(rcx, rcy);
          g.lineTo(rcx + Math.cos(sAngle) * 25, rcy + Math.sin(sAngle) * 25);
          g.stroke();

          // Target blip
          g.fillStyle = "#a8ffba";
          g.beginPath();
          g.arc(rcx + 16, rcy - 15, 3, 0, Math.PI * 2);
          g.fill();
        } else {
          // Blackout dim phosphor ghost
          g.fillStyle = "#0b2910";
          g.font = "12px VT323, monospace";
          g.textAlign = "left";
          g.fillText("K.O.M.R.A.D.-84 // OFFLINE", 386, 66);
        }

        // Bottom Nameplate ("K.O.M.R.A.D.-84") & Green СЕТЬ LED
        g.fillStyle = "#ab9e74";
        g.fillRect(388, 204, 78, 16);
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 2;
        g.strokeRect(388, 204, 78, 16);
        g.fillStyle = "#0a0c0a";
        g.font = "bold 12px VT323, monospace";
        g.textAlign = "center";
        g.fillText("K.O.M.R.A.D.-84", 427, 216);

        g.fillStyle = "#cfc399";
        g.font = "bold 12px VT323, monospace";
        g.fillText("СЕТЬ", 498, 216);

        g.fillStyle = "#39ff5a";
        g.beginPath();
        g.arc(520, 212, 5, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 1.5;
        g.stroke();

        // 7. SHIFT Power Clutch Bar under CRT (Bottom Right)
        g.fillStyle = "#0a0c0a";
        g.fillRect(352, 240, 196, 62);
        g.fillStyle = "#4b6048";
        g.fillRect(349, 237, 196, 62);
        g.strokeStyle = "#0a0c0a";
        g.lineWidth = 2.5;
        g.strokeRect(349, 237, 196, 62);

        g.fillStyle = state.redline ? "#eb261f" : "#e6ddb8";
        g.font = "bold 12px VT323, monospace";
        g.textAlign = "left";
        g.fillText(
          state.redline
            ? "SHIFT CLUTCH // 145 MW [REDLINE OVERCLOCK!]"
            : "SHIFT CLUTCH // 95 MW [HOLD SHIFT TO ROUTE]",
          357,
          251
        );

        const bars = [
          { lbl: "COOLING", x: 357, n: state.redline ? 6 : 4, c: "#39ff5a" },
          { lbl: "DEFENSE", x: 419, n: state.redline ? 6 : 3, c: "#ff881c" },
          { lbl: "FACILITY", x: 481, n: state.redline ? 5 : 2, c: "#eb261f" },
        ];
        bars.forEach((b) => {
          g.fillStyle = "#222c21";
          g.fillRect(b.x, 257, 56, 34);
          g.strokeStyle = "#0a0c0a";
          g.lineWidth = 1.8;
          g.strokeRect(b.x, 257, 56, 34);

          g.fillStyle = "#e6ddb8";
          g.font = "10px VT323, monospace";
          g.fillText(b.lbl, b.x + 4, 267);

          for (let i = 0; i < 6; i++) {
            g.fillStyle = i < b.n ? b.c : "#161c16";
            g.fillRect(b.x + 4 + i * 8, 272, 6, 13);
          }
        });

        g.restore();
      }

      // Post-process scene into strict Bayer-dithered, 32-color quantized micro-pixel art!
      function quantizeAndDitherToMicroPixels() {
        const imgData = sctx.getImageData(0, 0, BASE_W, BASE_H);
        const data = imgData.data;
        const ditherStrength = 18; // Controls crisp Bayer 4x4 stippling

        for (let y = 0; y < BASE_H; y++) {
          const bayerRow = BAYER_4X4[y & 3];
          const rowOffset = y * BASE_W * 4;
          for (let x = 0; x < BASE_W; x++) {
            const idx = rowOffset + (x << 2);
            const bayer = bayerRow[x & 3] * ditherStrength;

            const r = Math.max(0, Math.min(255, (data[idx] + bayer) | 0));
            const g = Math.max(0, Math.min(255, (data[idx + 1] + bayer) | 0));
            const b = Math.max(0, Math.min(255, (data[idx + 2] + bayer) | 0));

            const lutIdx = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
            const palColor = PALETTE_RGB[LUT[lutIdx]];

            data[idx] = palColor[0];
            data[idx + 1] = palColor[1];
            data[idx + 2] = palColor[2];
            data[idx + 3] = 255;
          }
        }

        ctx.putImageData(imgData, 0, 0);
      }

      function loop() {
        state.tick++;
        drawMicroScene(sctx);
        quantizeAndDitherToMicroPixels();
        requestAnimationFrame(loop);
      }

      // Interactive drag-operated levers mapped to logical 560x315 space
      let activeSwitchIdx = -1;
      let switchDragStartY = 0;

      canvas.addEventListener("pointerdown", (e) => {
        const r = canvas.getBoundingClientRect();
        const lx = ((e.clientX - r.left) / r.width) * 560;
        const ly = ((e.clientY - r.top) / r.height) * 315;

        // Toggle switches area (must drag vertically to flip!)
        if (lx >= 32 && lx <= 135 && ly >= 185 && ly <= 285) {
          canvas.setPointerCapture(e.pointerId);
          activeSwitchIdx = lx < 66 ? 0 : lx < 100 ? 1 : 2;
          switchDragStartY = ly;
        }

        // AZ-5 button area
        if (lx >= 258 && lx <= 325 && ly >= 175 && ly <= 240) {
          state.az5Pressed = true;
          setTimeout(() => {
            state.az5Pressed = false;
          }, 260);
        }
      });

      canvas.addEventListener("pointermove", (e) => {
        if (activeSwitchIdx < 0) return;
        const r = canvas.getBoundingClientRect();
        const ly = ((e.clientY - r.top) / r.height) * 315;
        const dy = ly - switchDragStartY;
        if (dy > 10) {
          state.switches[activeSwitchIdx] = false;
        } else if (dy < -10) {
          state.switches[activeSwitchIdx] = true;
        }
      });

      canvas.addEventListener("pointerup", () => {
        activeSwitchIdx = -1;
      });

      // Resolution buttons
      document.querySelectorAll("[data-res]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-res]").forEach((b) => b.classList.remove("res-active"));
          btn.classList.add("res-active");
          setResolution(parseInt(btn.getAttribute("data-res"), 10));
        });
      });

      document.getElementById("btnCompact").addEventListener("click", () => {
        document.getElementById("pixelStage").classList.toggle("compact-view");
      });

      document.getElementById("btnToggleCrt").addEventListener("click", () => {
        state.crtPower = !state.crtPower;
      });

      document.getElementById("btnToggleShift").addEventListener("click", () => {
        state.redline = !state.redline;
      });

      setResolution(560);
      loop();
    </script>
